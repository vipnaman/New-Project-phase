{% extends 'base.html' %}

{% block title %}Register | RAKTA{% endblock %}

{% block content %}
  <section class="section auth-section">
    <div class="container form-wrap narrow">
      <form id="registerForm" class="form-card">
        <h1>Create account</h1>
        <label>Name<input type="text" name="name" required /></label>
        <label>Email<input type="email" name="email" required /></label>
        <label>Password
          <span class="password-field">
            <input type="password" name="password" autocomplete="new-password" required />
            <button class="password-toggle" type="button" data-password-toggle aria-label="Show password" title="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m4 4 16 16"/></svg>
            </button>
          </span>
        </label>
        <button class="btn btn-primary" type="submit">Register</button>
      </form>
    </div>
  </section>
{% endblock %}

{% block scripts %}
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
{% endblock %}
