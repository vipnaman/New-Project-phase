{% extends 'base.html' %}

{% block content %}
  <section class="admin-shell">
    <div class="container admin-shell-inner">
      <aside class="admin-sidebar" aria-label="Admin sections">
        <div class="admin-sidebar-heading">
          <span class="eyebrow">RAKTA control room</span>
          <strong>Administration</strong>
        </div>
        <nav class="admin-nav" aria-label="Admin navigation">
          <a href="{{ url_for('main.admin_dashboard') }}" {% if request.endpoint == 'main.admin_dashboard' %}aria-current="page"{% endif %}>Overview</a>
          <a href="{{ url_for('main.admin_users') }}" {% if request.endpoint == 'main.admin_users' %}aria-current="page"{% endif %}>Users</a>
          <a href="{{ url_for('main.admin_donors') }}" {% if request.endpoint == 'main.admin_donors' %}aria-current="page"{% endif %}>Donors</a>
          <a href="{{ url_for('main.admin_requests') }}" {% if request.endpoint == 'main.admin_requests' %}aria-current="page"{% endif %}>Blood requests</a>
          <a href="{{ url_for('main.admin_hospitals') }}" {% if request.endpoint == 'main.admin_hospitals' %}aria-current="page"{% endif %}>Hospitals</a>
          <a href="{{ url_for('main.admin_reports') }}" {% if request.endpoint == 'main.admin_reports' %}aria-current="page"{% endif %}>Listing reports</a>
          <a href="{{ url_for('main.admin_analytics') }}" {% if request.endpoint == 'main.admin_analytics' %}aria-current="page"{% endif %}>Activity</a>
          <a href="{{ url_for('main.admin_settings') }}" {% if request.endpoint == 'main.admin_settings' %}aria-current="page"{% endif %}>Site design</a>
        </nav>
      </aside>
      <div class="admin-workspace">
        {% block admin_content %}{% endblock %}
      </div>
    </div>
  </section>
{% endblock %}
