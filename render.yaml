services:
  - type: keyvalue
    name: rakta-rate-limit
    region: oregon
    plan: free
    ipAllowList: []

  - type: web
    name: rakta
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && gunicorn --workers 1 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rakta-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: rakta-rate-limit
          property: connectionString
databases:
  - name: rakta-db
    databaseName: rakta
    user: rakta
    region: oregon
    plan: free
