services:
  - type: keyvalue
    name: rakta-rate-limit
    region: oregon
    plan: starter
    ipAllowList: []

  - type: web
    name: rakta
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app run.py db upgrade
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rakta-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: rakta-rate-limit
          property: connectionString
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"

  - type: cron
    name: rakta-expire-requests
    runtime: python
    region: oregon
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py expire-requests
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: rakta
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: rakta-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: rakta-rate-limit
          property: connectionString
      - key: MAIL_SERVER
        fromService:
          type: web
          name: rakta
          envVarKey: MAIL_SERVER
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        fromService:
          type: web
          name: rakta
          envVarKey: MAIL_USERNAME
      - key: MAIL_PASSWORD
        fromService:
          type: web
          name: rakta
          envVarKey: MAIL_PASSWORD
      - key: MAIL_DEFAULT_SENDER
        fromService:
          type: web
          name: rakta
          envVarKey: MAIL_DEFAULT_SENDER
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"

databases:
  - name: rakta-db
    databaseName: rakta
    user: rakta
    region: oregon
    plan: basic-256mb
